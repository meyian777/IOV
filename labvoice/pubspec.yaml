name: labvoice
description: "LabVoice Developer Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  speech_to_text: ^7.0.0
  url_launcher: ^6.3.0
  http: ^1.5.0
  cupertino_icons: ^1.0.8
  audioplayers: ^6.7.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/project_state.json
    - assets/data/session_state.json